name: Laravel Playwright CI

on:
  pull_request:
    branches: [main]

  schedule:
    # Every day at 00:00 WIB (17:00 UTC)
    - cron: '0 17 * * *'

  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Cache Composer dependencies
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # Install Node dependencies
      - name: Install Node dependencies
        run: npm ci

      # Build Vite assets
      - name: Build frontend assets
        run: npm run build

      # Prepare Laravel
      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          php artisan route:clear
          php artisan view:clear

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Run smoke tests for Pull Requests
      - name: Run Playwright smoke tests
        if: github.event_name == 'pull_request'
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8000
          SESSION_DRIVER: file
          CACHE_STORE: file
          QUEUE_CONNECTION: sync
        run: npx playwright test --grep @smoke --reporter=html

      # Run full regression for nightly schedule and manual trigger
      - name: Run Playwright full regression
        if: github.event_name != 'pull_request'
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8000
          SESSION_DRIVER: file
          CACHE_STORE: file
          QUEUE_CONNECTION: sync
        run: npx playwright test --reporter=html

      # Show Laravel log if failed
      - name: Show Laravel log
        if: failure()
        run: |
          if [ -f storage/logs/laravel.log ]; then
            echo "===== Laravel Log ====="
            cat storage/logs/laravel.log
          fi

      # Upload Playwright HTML report
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30